name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm run build
        env:
          # public values, safe to keep in the repo
          VITE_SANITY_PROJECT_ID: 7i1qvsy2
          VITE_SANITY_DATASET: production
          # 'true' also shows the sample issues after the real ones; set to 'false' for real issues only
          VITE_MOCK_DATA: 'true'
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KENTIZ_DERGI }}
          projectId: kentiz-dergi
